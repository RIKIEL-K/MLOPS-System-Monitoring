receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Regroupe les logs en paquets avant l'envoi vers Kafka.
  batch:
    send_batch_size: 100
    timeout: 2s

exporters:
  kafka:
    brokers:
      - kafka:29092              
    protocol_version: "2.1.0"   
    client_id: otel-collector 

    logs:
      topic: aiops-logs-topic    
      encoding: otlp_json        

  debug:
    verbosity: normal            

service:
  pipelines:
    logs:
      receivers:  [otlp]
      processors: [batch]
      exporters:  [kafka, debug]
